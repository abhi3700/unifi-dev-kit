[dependencies]
chrono = "0.4.40"
colored = "3.0.0"
dotenvy = "0.15.7"
eyre = "0.6.12"
spinoff = {version = "0.8.0",features = ["arc", "line", "dots"]}
tokio = { version =  "1.46.1", features = ["rt-multi-thread"] }
unifi-sdk-rs ={ path = "../../sdk/rust" }
unifi-sdk-primitives = {workspace = true, features = ["utils"]}

[dev-dependencies]
alloy-primitives = { version = "1.5.7", features = ["k256"] }
alloy-sol-types = "1.5.7"
k256 = "0.13.4"
